services:
  db:
    image: postgres:16
    environment:
      POSTGRES_DB: clinica
      POSTGRES_USER: vet_admin
      POSTGRES_PASSWORD: vet_admin
    ports:
      - "5433:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
      - ./src/main/resources/db/tables.sql:/docker-entrypoint-initdb.d/01-tables.sql
      - ./src/main/resources/db/view.sql:/docker-entrypoint-initdb.d/02-view.sql
      - ./src/main/resources/db/index.sql:/docker-entrypoint-initdb.d/03-index.sql
      - ./src/main/resources/db/seed.sql:/docker-entrypoint-initdb.d/04-seed.sql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U vet_admin -d clinica"]
      interval: 5s
      timeout: 5s
      retries: 10

  backend:
    build: .
    ports:
      - "8080:8080"
    environment:
      DB_URL: jdbc:postgresql://db:5432/clinica
      DB_USER: vet_admin
      DB_PASSWORD: vet_admin
    depends_on:
      db:
        condition: service_healthy

volumes:
  pgdata:
